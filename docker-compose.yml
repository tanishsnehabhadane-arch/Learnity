version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: learnity-postgres
    environment:
      POSTGRES_USER: learnity
      POSTGRES_PASSWORD: learnity
      POSTGRES_DB: learnity
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnity"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: learnity-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: learnity-api
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql://learnity:learnity@postgres:5432/learnity
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: learnity-worker
    command: ["node", "dist/jobs/worker.js"]
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql://learnity:learnity@postgres:5432/learnity
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
